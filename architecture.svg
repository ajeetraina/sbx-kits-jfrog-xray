<text x="362.0" y="626" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Vulnerability &amp; license</text>
<text x="362.0" y="644" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">scanning</text>
<text x="362.0" y="668" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Impact-path analysis</text>
