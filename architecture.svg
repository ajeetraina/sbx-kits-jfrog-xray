<text x="634.0" y="186" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">jf  (JFrog CLI)</text>
<text x="634.0" y="206" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">JF_URL = https://&lt;host&gt;</text>
<text x="634.0" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">JF_ACCESS_TOKEN =</text>
<text x="650.0" y="242" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">proxy-managed</text>
