<rect x="0" y="0" width="980" height="812" fill="#ffffff"/>
<text x="490.0" y="50" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">JFrog Xray — Docker Sandboxes kit architecture</text>
<text x="490.0" y="76" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">The real access token stays on the host; the sandbox only ever holds a proxy-managed sentinel.</text>
