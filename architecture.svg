<text x="362.0" y="228" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">gemini / shell …</text>
<text x="362.0" y="248" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">runs security scans</text>
