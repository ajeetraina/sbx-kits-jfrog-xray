<text x="56" y="374" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">sbx secret set jfrog</text>
<text x="56" y="394" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">real JFrog access token</text>
<rect x="320.0" y="316" width="520" height="118" rx="16" ry="16" fill="url(#g2)" stroke="#fcd34d" stroke-width="2" filter="url(#shadow)"/>
<text x="342.0" y="346" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#b45309" text-anchor="start">sbx egress proxy</text>
<rect x="685.6" y="327" width="124.8" height="22" rx="11" ry="11" fill="#fde68a"/>
<text x="748.0" y="342" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#92400e" text-anchor="middle" letter-spacing="0.3">trust boundary</text>
<text x="344.0" y="374" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#78350f" text-anchor="start">•  Egress allow-list:  releases.jfrog.io ,  &lt;jfrog_host&gt;   (deny all else)</text>
<text x="344.0" y="396" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#78350f" text-anchor="start">•  Swaps sentinel  proxy-managed  →  real token  on the way out</text>
<text x="344.0" y="418" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="500" fill="#78350f" text-anchor="start">•  Reads the real token from the host secret store  (host-side only)</text>
